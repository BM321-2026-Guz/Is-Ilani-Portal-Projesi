openapi: 3.0.3
info:
  title: İş İlanı Portalı API
  version: 0.1.0
  description: >
    Sprint 1 taslak sözleşmesi. Sınır belgesi docs/sistem-vizyonu-ve-sinirlar.md
    dosyasındadır. Akış: ilan yayınla, başvur, kısa listeye al.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /api
tags:
  - name: auth
    description: Kayıt, giriş ve oturum
  - name: jobs
    description: Staj ve yarı zamanlı ilanlar
  - name: applications
    description: Başvuru ve kısa liste
paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Kayıt
      description: Rol kayıtta seçilir. Öğrenci işe alım profili, işe alım uzmanı öğrenci profili gönderemez.
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Hesap açıldı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/login:
    post:
      tags: [auth]
      summary: Giriş
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: JWT döner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/me:
    get:
      tags: [auth]
      summary: Oturumdaki kullanıcı
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Kullanıcı ve profil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /students/me:
    patch:
      tags: [auth]
      summary: Öğrenci profilini güncelle
      operationId: updateStudentProfile
      security:
        - bearerAuth: []
      x-required-role: student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentProfile"
      responses:
        "200":
          description: Profil güncellendi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /recruiters/me:
    patch:
      tags: [auth]
      summary: İşe alım profilini güncelle
      operationId: updateRecruiterProfile
      security:
        - bearerAuth: []
      x-required-role: recruiter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecruiterProfile"
      responses:
        "200":
          description: Profil güncellendi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /jobs:
    get:
      tags: [jobs]
      summary: Açık ilanları listele
      description: Giriş gerekmez. Yalnızca status=open ilanlar döner.
      operationId: listJobs
      security: []
      parameters:
        - in: query
          name: type
          schema:
            $ref: "#/components/schemas/JobType"
        - in: query
          name: q
          schema:
            type: string
          description: Başlıkta arama
      responses:
        "200":
          description: İlan listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [jobs]
      summary: İlan aç
      operationId: createJob
      security:
        - bearerAuth: []
      x-required-role: recruiter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobWrite"
      responses:
        "201":
          description: İlan açıldı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /jobs/{jobId}:
    get:
      tags: [jobs]
      summary: İlan detayı
      description: Giriş gerekmez.
      operationId: getJob
      security: []
      parameters:
        - $ref: "#/components/parameters/jobId"
      responses:
        "200":
          description: İlan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [jobs]
      summary: Kendi ilanını güncelle
      operationId: updateJob
      security:
        - bearerAuth: []
      x-required-role: recruiter
      parameters:
        - $ref: "#/components/parameters/jobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobWrite"
      responses:
        "200":
          description: İlan güncellendi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs/{jobId}/close:
    post:
      tags: [jobs]
      summary: Kendi ilanını kapat
      operationId: closeJob
      security:
        - bearerAuth: []
      x-required-role: recruiter
      parameters:
        - $ref: "#/components/parameters/jobId"
      responses:
        "200":
          description: İlan kapandı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /jobs/{jobId}/applications:
    post:
      tags: [applications]
      summary: İlana başvur
      description: Aynı öğrenci aynı ilana ikinci kez başvuramaz.
      operationId: applyToJob
      security:
        - bearerAuth: []
      x-required-role: student
      parameters:
        - $ref: "#/components/parameters/jobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationWrite"
      responses:
        "201":
          description: Başvuru alındı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [applications]
      summary: İlanın adaylarını listele
      description: Yalnızca ilanı açan işe alım uzmanı görür.
      operationId: listJobApplications
      security:
        - bearerAuth: []
      x-required-role: recruiter
      parameters:
        - $ref: "#/components/parameters/jobId"
      responses:
        "200":
          description: Aday listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /applications/me:
    get:
      tags: [applications]
      summary: Kendi başvurularım
      operationId: listMyApplications
      security:
        - bearerAuth: []
      x-required-role: student
      responses:
        "200":
          description: Başvuru listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /applications/{applicationId}:
    patch:
      tags: [applications]
      summary: Başvuru durumunu güncelle
      description: >
        İlanın sahibi kısa listeye alır veya reddeder.
        applied durumundan shortlisted ya da rejected değerine geçilir.
      operationId: updateApplicationStatus
      security:
        - bearerAuth: []
      x-required-role: recruiter
      parameters:
        - $ref: "#/components/parameters/applicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationStatusWrite"
      responses:
        "200":
          description: Durum güncellendi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    jobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    applicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: İstek hatalı
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Giriş gerekli
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Bu rol veya bu kayıt için yetki yok
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Kayıt yok
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Çakışma. E-posta kayıtlı ya da başvuru zaten var.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Role:
      type: string
      enum: [student, recruiter]
    JobType:
      type: string
      enum: [internship, part-time]
    JobStatus:
      type: string
      enum: [open, closed]
    ApplicationStatus:
      type: string
      enum: [applied, shortlisted, rejected]
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    StudentProfile:
      type: object
      required: [university, department]
      properties:
        university:
          type: string
        department:
          type: string
        year:
          type: integer
          minimum: 1
        skills:
          type: array
          items:
            type: string
        portfolioUrl:
          type: string
          format: uri
        cvUrl:
          type: string
          format: uri
    RecruiterProfile:
      type: object
      required: [companyName]
      properties:
        companyName:
          type: string
        title:
          type: string
    RegisterRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        role:
          $ref: "#/components/schemas/Role"
        studentProfile:
          $ref: "#/components/schemas/StudentProfile"
        recruiterProfile:
          $ref: "#/components/schemas/RecruiterProfile"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
    Me:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            studentProfile:
              $ref: "#/components/schemas/StudentProfile"
            recruiterProfile:
              $ref: "#/components/schemas/RecruiterProfile"
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT
        user:
          $ref: "#/components/schemas/Me"
    Job:
      type: object
      required: [id, recruiterId, companyName, title, description, type, status]
      properties:
        id:
          type: string
        recruiterId:
          type: string
        companyName:
          type: string
          description: İşe alım profilindeki şirket adı. İstemci ikinci istek atmaz.
        title:
          type: string
        description:
          type: string
        type:
          $ref: "#/components/schemas/JobType"
        location:
          type: string
        deadline:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/JobStatus"
        createdAt:
          type: string
          format: date-time
    JobWrite:
      type: object
      required: [title, description, type]
      properties:
        title:
          type: string
        description:
          type: string
        type:
          $ref: "#/components/schemas/JobType"
        location:
          type: string
        deadline:
          type: string
          format: date
    Application:
      type: object
      required: [id, jobId, studentId, status]
      properties:
        id:
          type: string
        jobId:
          type: string
        studentId:
          type: string
        note:
          type: string
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        studentProfile:
          $ref: "#/components/schemas/StudentProfile"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApplicationWrite:
      type: object
      properties:
        note:
          type: string
          description: Başvuru notu. Portföy profilde durur.
    ApplicationStatusWrite:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [shortlisted, rejected]
